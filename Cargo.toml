[workspace]
resolver = "2"
members = ["crates/core", "crates/audio", "crates/analyzer", "crates/connectors", "app/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[profile.dev.package."*"]
opt-level = 2

# Keep debug builds small: line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"

# Synthesis and fingerprinting in tests are slow without optimisation.
[profile.dev.package.cd-audio]
opt-level = 2

[profile.dev.package.cd-analyzer]
opt-level = 2
