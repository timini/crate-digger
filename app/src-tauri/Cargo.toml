[package]
name = "crate-digger"
description = "Crate Digger desktop app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "crate_digger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cd-connectors = { path = "../../crates/connectors" }
cd-protocol = { path = "../../crates/protocol" }
uuid = { version = "1.26.1", features = ["v4"] }
cd-core = { path = "../../crates/core" }
cd-audio = { path = "../../crates/audio" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }
cd-analyzer = { version = "0.1.0", path = "../../crates/analyzer" }
ureq = "3.4.2"
