[package]
name = "cd-analyzer"
description = "Crate Digger audio analysis worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "cd_analyzer"

[[bin]]
name = "cd-analyzer"
path = "src/main.rs"

[dependencies]
cd-audio = { version = "0.1.0", path = "../audio" }
cd-core = { version = "0.1.0", path = "../core" }
ebur128 = "0.1.10"
realfft = "3.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
