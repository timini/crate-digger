[package]
name = "cd-analyzer"
description = "Crate Digger audio analysis worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "cd_analyzer"

[[bin]]
name = "cd-analyzer"
path = "src/main.rs"

[dependencies]
cd-audio = { version = "0.1.0", path = "../audio" }
cd-core = { version = "0.1.0", path = "../core" }
ebur128 = "0.1.10"
realfft = "3.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tract-onnx = "0.23.8"

[dev-dependencies]
blake3 = "1.8.7"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3.27.0"
walkdir = "2.5.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
