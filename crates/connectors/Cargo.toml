[package]
name = "cd-connectors"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cd-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: schemas reach the model with properties in the order written,
# which constrained decoding follows (tool before arguments, artist before title).
serde_json = { version = "1.0", features = ["preserve_order"] }
ureq = "3.4.2"
url = "2.5"
sha2 = "0.11.0"
rusty-chromaprint = "0.3.0"
uuid = { version = "1.26.1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
