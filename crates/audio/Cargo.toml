[package]
name = "cd-audio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "cd_audio"

[dependencies]
cpal = "0.18.2"
rtrb = "0.4.0"
rubato = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "alac", "flac", "mp3", "pcm", "vorbis", "wav", "aiff", "isomp4", "ogg"] }
thiserror = "2.0.20"
tracing = "0.1.44"
